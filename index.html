<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Umut — kişisel portfolyo. Projelerimi keşfet." />
    <title>Umut — Portfolyo</title>
    <script>
      // Seçili temayı sayfa çizilmeden önce uygula (renk sıçramasını önler)
      try {
        var savedTheme = localStorage.getItem('umut-portfolyo:theme:v1')
        if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
